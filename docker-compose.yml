services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: funding_finder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:5432:5432'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/funding_finder
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/funding_finder
      NODE_ENV: production
      PORT: '3000'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required (min 32 chars)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (min 32 chars)}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-x-ai/grok-4.1-fast:free}
      AI_MODELS: ${AI_MODELS:-}
      SETTLE: usdt
      MIN_FUNDING_ABS: '0.0005'
      MIN_VOLUME_24H: '1000'
      CRYPTO_PAY_API_TOKEN: ${CRYPTO_PAY_API_TOKEN:-}
      CRYPTO_BOT_USERNAME: CryptoBot
      CRYPTO_PAY_NETWORK: mainnet
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_NETWORK: live
      API_BASE_URL: ${API_BASE_URL:-https://funding-finder-api.onrender.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WEB_AUTH_DOMAIN: ${WEB_AUTH_DOMAIN:-funding-finder-frontend.onrender.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://t.me,https://telegram.org,https://funding-finder-frontend.onrender.com}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      REDIS_URL: ${REDIS_URL:-}
      PUBLIC_SIGNAL_CHANNEL: ${PUBLIC_SIGNAL_CHANNEL:-}
      SUPPORT_TELEGRAM: ${SUPPORT_TELEGRAM:-fundinganalyzerbot}
      PROMETHEUS_PUBLIC: ${PROMETHEUS_PUBLIC:-0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
